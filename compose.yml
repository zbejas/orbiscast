services:
  orbiscast:
    # You can use a specific version if you want by replacing latest with the version number
    # See https://hub.docker.com/r/zbejas/orbiscast/tags?ordering=name for available versions
    image: docker.io/zbejas/orbiscast:latest
    container_name: orbiscast
    restart: unless-stopped
    # The WebUI and API listen here. Change the host side if 3000 is taken.
    ports:
      - "3000:3000"
    # Data is stored in /app/data inside the container.
    volumes:
      - ./data:/app/data
    # No env_file is required. Configure everything in the WebUI at http://localhost:3000.
    # Existing installs can place their old .env at ./data/.env for a one-time import.
    # environment:
    #   - PORT=3000
